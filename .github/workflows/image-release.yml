name: Ui integration and image release
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    uses: techshakti55/technotes-documentation/.github/workflows/isolated-test.yml@5f3879ca6a4b0e73c8d730bf2e24622413a0c1d3
    with:
      harness_ref: 5f3879ca6a4b0e73c8d730bf2e24622413a0c1d3
      ui_ref: ${{ github.sha }}
  publish:
    outputs:
      image: ${{ steps.image.outputs.image }}
    needs: integration
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build and publish tested source version
        id: image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/techshakti55/technotes-ui:sha-$SOURCE_SHA"
          docker build --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=https://technotes.co.in \
            --build-arg VITE_OAUTH_ISSUER=https://auth.technotes.co.in \
            --build-arg VITE_SITE_URL=https://technotes.co.in \
            --label org.opencontainers.image.source=https://github.com/techshakti55/technotes-ui \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            -t "$image" .
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          printf '### Published image\n`%s`\n\nSource: `%s`\n\nProduction has not been deployed.\n' "$digest" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Registry logout
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          test -n "$ROLE_ARN"
          [[ "$IMAGE" =~ ^ghcr\.io/techshakti55/technotes-ui@sha256:[a-f0-9]{64}$ ]]
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: '651022780286'
          role-session-name: technotes-ui-deploy
      - name: Deploy UI through SSM and wait for result
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          AWS_PAGER: ''
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          image = os.environ["IMAGE"]
          if not re.fullmatch(r"ghcr\.io/techshakti55/technotes-ui@sha256:[a-f0-9]{64}", image):
              raise SystemExit("Invalid deployment image")
          instance = "i-07284b353e2fae538"
          command = "runuser -u ubuntu -- bash /home/ubuntu/technotes-deployment/scripts/deploy-ui.sh " + image
          def aws(*args):
              return subprocess.run(["aws", "ssm", *args, "--output", "json"], capture_output=True, text=True)
          sent = aws("send-command", "--instance-ids", instance,
                     "--document-name", "AWS-RunShellScript", "--timeout-seconds", "120",
                     "--parameters", json.dumps({"commands": [command], "executionTimeout": ["600"]}))
          if sent.returncode:
              raise SystemExit(sent.stderr)
          command_id = json.loads(sent.stdout)["Command"]["CommandId"]
          print("SSM command:", command_id, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n### UI deployment\nSSM command: `" + command_id + "`\nImage: `" + image + "`\n")
          for attempt in range(160):
              result = aws("get-command-invocation", "--command-id", command_id, "--instance-id", instance)
              if result.returncode:
                  if "InvocationDoesNotExist" in result.stderr:
                      time.sleep(5)
                      continue
                  raise SystemExit(result.stderr)
              invocation = json.loads(result.stdout)
              status = invocation["Status"]
              if status in ("Pending", "InProgress", "Delayed"):
                  time.sleep(5)
                  continue
              print(invocation.get("StandardOutputContent", ""))
              print(invocation.get("StandardErrorContent", ""))
              if status != "Success" or invocation.get("ResponseCode") != 0:
                  raise SystemExit("Deployment failed: " + status)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Result: Success. Check browser login and public notes.\n")
              break
          else:
              raise SystemExit("SSM result timed out. Check the command in AWS before another deployment.")
          PY
