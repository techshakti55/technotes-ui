name: UI verification
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:28080
          VITE_OAUTH_ISSUER: http://localhost:29000
          VITE_SITE_URL: http://localhost:25173
          VITE_DEMO_MODE: 'false'
      - name: Verify production image packaging
        run: >-
          docker build --platform linux/amd64
          --build-arg VITE_API_BASE_URL=https://technotes.co.in
          --build-arg VITE_OAUTH_ISSUER=https://auth.technotes.co.in
          --build-arg VITE_SITE_URL=https://technotes.co.in
          -t technotes-ui:ci .
